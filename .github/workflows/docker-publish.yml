name: Build and publish Docker image to GHCR

# Builds the ReconGuard Pro image and pushes it to GitHub Container Registry
# (ghcr.io) on every push to the default branch and on version tags (v*).
# Uses the built-in GITHUB_TOKEN — no manual secrets to configure.
#
# After the first successful run, make the package public so others can pull:
#   GitHub -> your profile/org -> Packages -> reconguard-pro ->
#   Package settings -> Change visibility -> Public
# (or grant specific users/teams read access).

on:
  push:
    branches: [ "master", "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Image repo is derived from the GitHub repo (owner/repo), lowercased by the
  # metadata-action. Published as ghcr.io/<owner>/<repo>.
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # required to push to GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
