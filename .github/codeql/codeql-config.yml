# CodeQL configuration for ReconGuard Pro.
#
# Scope SAST to the APPLICATION code. Test files legitimately use membership
# checks like `assert "brand-co.com" in generated_set` and
# `assert "<text>" in evidence_message`, which CodeQL's "incomplete URL
# substring sanitization" query flags as false positives — they are test
# assertions on in-memory values, not URL/host sanitization. Scanning the real
# runtime code (main.py) keeps the alerts meaningful.
name: "ReconGuard Pro CodeQL config"

paths:
  - main.py
  - static

paths-ignore:
  - tests
  - wordlists
  - .github
